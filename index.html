<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Comeback</title>
  <meta name="description" content="Persoonlijke app om te trainen, te herstellen en weer volledig fit te worden voor voetbal.">
  <meta name="theme-color" content="#DCE1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0E12" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Inter:wght@400;500;600;700&display=swap">
  <script>
    // Thema meteen zetten, zodat er geen witte flits is in dark mode
    (function () {
      var p = 'auto';
      try { p = localStorage.getItem('comeback-theme') || 'auto'; } catch (e) { }
      var dark = p === 'dark' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Comeback">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="preload" href="assets/hero.webp" as="image">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main id="app" class="app" aria-live="polite">
    <div class="boot" role="status"><span class="wordmark">comeback</span><div class="ls-rail"><i></i></div><span class="sr">Laden…</span></div>
  </main>

  <nav class="tabbar glass" id="tabbar" aria-label="Hoofdnavigatie"></nav>

  <div id="rest-timer" class="rest-timer" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Opstartcontrole: blijft "Laden…" staan, dan tonen we welk bestand ontbreekt of faalt
    (function () {
      var errors = [];
      window.addEventListener('error', function (e) {
        errors.push((e.filename ? e.filename.split('/').slice(-2).join('/') + ': ' : '') + (e.message || 'laadfout'));
      }, true);
      setTimeout(function () {
        if (!document.querySelector('.boot')) return;
        var files = ['css/styles.css', 'js/env.js', 'js/config.js', 'js/db.js', 'js/sync.js', 'js/charts.js', 'js/sample.js', 'js/app.js', 'manifest.json', 'sw.js'];
        Promise.all(files.map(function (f) {
          return fetch(f, { cache: 'no-store' }).then(function (r) { return f + ': ' + (r.ok ? 'ok' : 'ONTBREEKT (' + r.status + ')'); })
            .catch(function () { return f + ': niet bereikbaar'; });
        })).then(function (lines) {
          var box = document.querySelector('.boot');
          if (!box) return;
          box.style.cssText = 'padding:40px 8px;font:14px/1.5 system-ui,sans-serif;text-align:left';
          box.innerHTML = '<b>De app start niet.</b><br>Controle van de bestanden:<pre style="white-space:pre-wrap;background:var(--surface-2);padding:12px;border-radius:12px">' +
            lines.join('\n') + (errors.length ? '\n\nFouten:\n' + errors.join('\n') : '') +
            '\n\nIndexedDB: ' + ('indexedDB' in window ? 'ok' : 'niet beschikbaar') + '</pre>' +
            'Staat er "ONTBREEKT"? Upload dat bestand dan in de juiste map op GitHub.<br>' +
            '<button onclick="navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()});return caches.keys()}).then(function(k){return Promise.all((k||[]).map(function(x){return caches.delete(x)}))}).then(function(){location.reload()})" style="margin-top:12px;padding:10px 16px;border-radius:999px;border:0;background:#111;color:#fff;font-weight:700">Cache wissen en herladen</button>';
        });
      }, 5000);
    })();
  </script>
</body>
</html>
